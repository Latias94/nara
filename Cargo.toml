[package]
name = "nara"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A Rust-native, declarative, data-driven game engine foundation."

[workspace]
resolver = "3"
members = [
    "crates/nara_app",
    "crates/nara_asset",
    "crates/nara_asset_watch",
    "crates/nara_audio",
    "crates/nara_core",
    "crates/nara_diagnostic",
    "crates/nara_ecs",
    "crates/nara_fs",
    "crates/nara_image",
    "crates/nara_identity",
    "crates/nara_input",
    "crates/nara_gameplay",
    "crates/nara_material",
    "crates/nara_project",
    "crates/nara_reflect",
    "crates/nara_render",
    "crates/nara_render_wgpu",
    "crates/nara_scene",
    "crates/nara_sprite",
    "crates/nara_sprite_render",
    "crates/nara_tilemap",
    "crates/nara_tasks",
    "crates/nara_tooling",
    "crates/nara_tooling_egui",
    "crates/nara_transform",
    "crates/nara_ui",
    "crates/nara_ui_render",
    "crates/nara_window",
    "crates/nara_winit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nara_app = { path = "crates/nara_app" }
nara_asset = { path = "crates/nara_asset" }
nara_asset_watch = { path = "crates/nara_asset_watch" }
nara_audio = { path = "crates/nara_audio" }
nara_core = { path = "crates/nara_core" }
nara_diagnostic = { path = "crates/nara_diagnostic" }
nara_ecs = { path = "crates/nara_ecs" }
nara_fs = { path = "crates/nara_fs" }
nara_image = { path = "crates/nara_image" }
nara_identity = { path = "crates/nara_identity" }
nara_input = { path = "crates/nara_input" }
nara_gameplay = { path = "crates/nara_gameplay" }
nara_material = { path = "crates/nara_material" }
nara_project = { path = "crates/nara_project" }
nara_reflect = { path = "crates/nara_reflect" }
nara_render = { path = "crates/nara_render" }
nara_render_wgpu = { path = "crates/nara_render_wgpu" }
nara_scene = { path = "crates/nara_scene" }
nara_sprite = { path = "crates/nara_sprite" }
nara_sprite_render = { path = "crates/nara_sprite_render" }
nara_tilemap = { path = "crates/nara_tilemap" }
nara_tasks = { path = "crates/nara_tasks" }
nara_tooling = { path = "crates/nara_tooling" }
nara_tooling_egui = { path = "crates/nara_tooling_egui" }
nara_transform = { path = "crates/nara_transform" }
nara_ui = { path = "crates/nara_ui" }
nara_ui_render = { path = "crates/nara_ui_render" }
nara_window = { path = "crates/nara_window" }
nara_winit = { path = "crates/nara_winit" }

bevy_ecs = "0.19"
bevy_reflect = { version = "0.19", features = ["glam"] }
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.35.0"
glam = { version = "0.30", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2.0"
raw-window-handle = "0.6"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
toml = "1.1"
tracing = "0.1"
uuid = "1.23.4"
winit = "=0.30.12"
pollster = "0.4"
wgpu = "=30.0.0"
rustix = "1.1.4"
windows-sys = "0.61.2"

[dependencies]
nara_app.workspace = true
nara_asset.workspace = true
nara_asset_watch = { workspace = true, optional = true }
nara_audio.workspace = true
nara_core.workspace = true
nara_diagnostic.workspace = true
nara_ecs.workspace = true
nara_fs.workspace = true
nara_image.workspace = true
nara_identity.workspace = true
nara_input.workspace = true
nara_gameplay.workspace = true
nara_material.workspace = true
nara_project.workspace = true
nara_reflect.workspace = true
nara_render.workspace = true
nara_render_wgpu = { workspace = true, optional = true }
nara_scene.workspace = true
nara_sprite.workspace = true
nara_sprite_render.workspace = true
nara_tilemap.workspace = true
nara_tasks.workspace = true
nara_tooling.workspace = true
nara_tooling_egui = { workspace = true, optional = true }
nara_transform.workspace = true
nara_ui.workspace = true
nara_ui_render.workspace = true
nara_window.workspace = true
nara_winit = { workspace = true, optional = true }

[dev-dependencies]
bevy_ecs.workspace = true
image.workspace = true
ron.workspace = true
serde_json.workspace = true

[features]
default = []
serde = [
    "nara_asset/serde",
    "nara_core/serde",
    "nara_diagnostic/serde",
    "nara_ecs/serde",
    "nara_image/serde",
    "nara_identity/serde",
    "nara_input/serde",
    "nara_gameplay/serde",
    "nara_material/serde",
    "nara_reflect/serde",
    "nara_transform/serde",
    "nara_render/serde",
    "nara_scene/serde",
    "nara_sprite/serde",
    "nara_tilemap/serde",
    "nara_ui/serde",
    "nara_window/serde",
]
winit = ["dep:nara_winit"]
wgpu = ["dep:nara_render_wgpu"]
egui = ["dep:nara_tooling_egui"]
asset-watch = ["dep:nara_asset_watch"]

[[example]]
name = "windowed_clear"
path = "examples/windowed_clear.rs"
required-features = ["winit", "wgpu"]

[[example]]
name = "windowed_sprites"
path = "examples/windowed_sprites.rs"
required-features = ["winit", "wgpu"]

[[example]]
name = "runtime_ui_panel"
path = "examples/runtime_ui_panel.rs"
required-features = ["winit", "wgpu"]

[[example]]
name = "asset_import_texture"
path = "examples/asset_import_texture.rs"

[[example]]
name = "headless_server"
path = "examples/headless_server.rs"

[[example]]
name = "scene_prefab_roundtrip"
path = "examples/scene_prefab_roundtrip.rs"
required-features = ["serde"]

[[example]]
name = "scene_patch_roundtrip"
path = "examples/scene_patch_roundtrip.rs"
required-features = ["serde"]

[[example]]
name = "component_schema_export"
path = "examples/component_schema_export.rs"
required-features = ["serde"]

[[example]]
name = "prefab_patch_override"
path = "examples/prefab_patch_override.rs"
required-features = ["serde"]
