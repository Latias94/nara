[package]
name = "nara"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "An open-source game engine written in Rust."

[workspace]
resolver = "3"
exclude = [
    "examples/shared-viewport",
    "reference-game",
    "samples/collect-game",
    "samples/two-level-game",
    "vendor/winit",
]
members = [
    "crates/nara_app",
    "crates/nara_asset",
    "crates/nara_audio",
    "crates/nara_core",
    "crates/nara_ecs",
    "crates/nara_ecs_derive",
    "crates/nara_editor_core",
    "crates/nara_input",
    "crates/nara_material_derive",
    "crates/nara_project",
    "crates/nara_physics2d",
    "crates/nara_reflect",
    "crates/nara_reflect_derive",
    "crates/nara_render",
    "crates/nara_scene",
    "crates/nara_ui",
    "crates/nara_window",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nara_app = { path = "crates/nara_app" }
nara_asset = { path = "crates/nara_asset" }
nara_audio = { path = "crates/nara_audio" }
nara_core = { path = "crates/nara_core" }
nara_ecs = { path = "crates/nara_ecs" }
nara_ecs_derive = { path = "crates/nara_ecs_derive" }
nara_input = { path = "crates/nara_input" }
nara_material_derive = { path = "crates/nara_material_derive" }
nara_project = { path = "crates/nara_project", default-features = false }
nara_physics2d = { path = "crates/nara_physics2d" }
nara_reflect = { path = "crates/nara_reflect" }
nara_reflect_derive = { path = "crates/nara_reflect_derive" }
nara_render = { path = "crates/nara_render" }
nara_scene = { path = "crates/nara_scene" }
nara_ui = { path = "crates/nara_ui", default-features = false }
nara_window = { path = "crates/nara_window" }

bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "async_executor", "backtrace"] }
bevy_tasks = { version = "=0.20.0", default-features = false }
base64 = "0.21.7"
bevy_ecs_macro_logic = "=0.20.0"
bevy_macro_utils = "=0.20.0"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
dunce = "1.0.5"
encase = "=0.12.1"
glam = { version = "0.33", features = ["serde"] }
getrandom = { version = "0.3.4", features = ["std"] }
guillotiere = "=0.7.0"
image = { version = "0.25", default-features = false, features = ["png"] }
icu_segmenter = { version = "2.2", default-features = false, features = ["compiled_data"] }
notify = "=8.2.0"
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", features = ["wgsl-in"] }
parley = { version = "=0.11.0", default-features = false, features = ["std", "complex-scripts"] }
taffy = { version = "=0.10.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
raw-window-handle = "0.6"
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
semver = { version = "1", features = ["serde"] }
static_assertions = "1"
swash = "=0.2.6"
thiserror = "2"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
toml = "1.1"
tracing = "0.1"
uuid = "1.23.4"
winit = { version = "=0.30.13", path = "vendor/winit" }
pollster = "0.4"
rapier2d = { version = "=0.33.0", default-features = false, features = ["dim2", "f32", "std"] }
proc-macro-crate = "3.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
trybuild = "1.0.118"
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
rustix = "1.1.4"
windows-sys = "0.61.2"

[patch.crates-io]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
winit = { path = "vendor/winit" }

[dependencies]
blake3 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
nara_app = { workspace = true, optional = true }
nara_asset = { workspace = true, optional = true, features = ["runtime"] }
nara_audio = { workspace = true, optional = true }
nara_core = { workspace = true, optional = true }
nara_ecs = { workspace = true, optional = true }
nara_input = { workspace = true, optional = true }
nara_physics2d = { workspace = true, optional = true }
nara_project = { workspace = true, optional = true }
nara_reflect = { workspace = true, optional = true }
nara_render = { workspace = true, optional = true, features = ["runtime"] }
nara_scene = { workspace = true, optional = true }
nara_ui = { workspace = true, optional = true }
nara_window = { workspace = true, optional = true, features = ["runtime"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
], optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
rustix = { workspace = true, features = ["net"], optional = true }

[dev-dependencies]
bevy_ecs.workspace = true
image.workspace = true
raw-window-handle.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
static_assertions.workspace = true
toml.workspace = true
tracing.workspace = true

[features]
scene-work-observation = ["dep:tracing", "nara_scene?/work-observation"]
default = ["runtime-core", "runtime-input", "runtime-window"]
parallel-executor = ["runtime-core", "nara_app/parallel-executor"]
runtime-core = [
    "dep:nara_app",
    "nara_app/diagnostics",
    "nara_app/tasks",
    "dep:nara_asset",
    "dep:nara_core",
    "dep:nara_ecs",
    "dep:nara_reflect",
    "dep:nara_scene",
    "dep:thiserror",
]
runtime-input = ["runtime-core", "dep:nara_input"]
runtime-window = ["runtime-core", "dep:nara_window"]
runtime-2d = [
    "runtime-input",
    "runtime-window",
    "dep:nara_render",
    "nara_render/image-runtime",
    "nara_render/animation",
    "nara_render/persistent",
    "nara_render/sprites",
    "nara_render/tiles",
]
presentation-2d = [
    "runtime-2d",
    "nara_render/sprite-render",
]
runtime-ui = [
    "runtime-input",
    "runtime-window",
    "dep:nara_ui",
    "nara_ui/runtime",
]
presentation-ui = [
    "runtime-ui",
    "dep:nara_render",
    "nara_render/hud-presentation",
]
asset-watch = ["runtime-core", "nara_asset/hot-reload"]
desktop-winit = ["runtime-input", "runtime-window", "nara_window/winit"]
audio = ["runtime-core", "dep:nara_audio"]
audio-device = ["audio", "nara_audio/device"]
physics-2d = ["runtime-2d", "dep:nara_physics2d"]
gamepad = ["runtime-input", "nara_input/gamepad"]
render-wgpu = ["runtime-window", "dep:nara_render", "nara_render/wgpu"]
serde = [
    "dep:serde",
    "dep:serde_json",
    "nara_app?/serde",
    "nara_asset?/serde",
    "nara_core?/serde",
    "nara_ecs?/serde",
    "nara_input?/serde",
    "nara_reflect?/serde",
    "nara_render?/serde",
    "nara_scene?/serde",
    "nara_ui?/serde",
    "nara_window?/serde",
]
project-runtime = [
    "runtime-core",
    "dep:blake3",
    "dep:rustix",
    "dep:windows-sys",
    "nara_core/fs-capabilities",
    "dep:nara_project",
]
project-workflow = [
    "project-runtime",
    "runtime-2d",
    "serde",
    "dep:getrandom",
    "dep:uuid",
    "dep:toml",
]
project-workflow-cargo-facts = ["project-workflow", "dep:serde_json"]
project-tooling = [
    "project-workflow-cargo-facts",
    "windows-sys?/Win32_System_JobObjects",
    "windows-sys?/Win32_Security_Cryptography",
    "rustix?/event",
    "rustix?/fs",
    "rustix?/process",
]

