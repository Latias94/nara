schema_version = 1

[project]
source_universe = 'be3dea0c-93ef-5607-ab84-af715a1f98b3'
native_document_identity = 'project_location'
name = "two-level-game"
stable_id = "two-level-game"
version = "0.1.0"

[paths]
assets = "assets"
scenes = "scenes"
prefabs = "prefabs"

[authoring]
state = "ready"
schema_bundle = "schema/authoring.bundle.json"

[startup]
default_scene = "meadow.scene.json"

[content]
scenes = ["cavern.scene.json"]

[input]
action_map = 'input/explorer.actions.json'

[runtime]
preset = "local-headless"
fixed_timestep_seconds = 0.02

[window]
enabled = false

[capabilities]
requested = ["runtime-2d"]

[profiles.desktop.capabilities]
requested = ["runtime-2d", "presentation-2d", "desktop-winit", "render-wgpu"]

[profiles.desktop.execution]
contract = "desktop-supervised-play/v1"

[profiles.desktop.window]
enabled = true
title = "Meadow / Cavern | WASD move | E travel | Q instance | M marker | B side room | K save | L load | R retry"
width = 960
height = 540
present_mode = "fifo"
resizable = true

[profiles.desktop.render.world_canvas]
width = 320
height = 180

[profiles.play-flow.capabilities]
requested = ["runtime-2d", "runtime-ui", "presentation-2d", "presentation-ui", "desktop-winit", "render-wgpu"]

[profiles.play-flow.window]
enabled = true
title = "Meadow / Cavern | Play Flow"
width = 960
height = 540
present_mode = "fifo"
resizable = true

[profiles.play-flow.render.world_canvas]
width = 320
height = 180

[profiles.play-flow.ui.primary_surface]
logical_width = 960
logical_height = 540
