[package]
name = "two-level-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[package.metadata.nara]
project-tool-protocol = 1

[workspace]
resolver = "3"

[dependencies]
nara = { path = "../..", default-features = false, features = ["runtime-2d", "serde", "project-tooling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
default = []
desktop = ["nara/presentation-2d", "nara/desktop-winit", "nara/render-wgpu"]

[lib]
name = "two_level_game"
path = "src/lib.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]
