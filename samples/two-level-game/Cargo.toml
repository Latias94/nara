[package]
name = "two-level-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[package.metadata.nara]
project-tool-protocol = 1

[workspace]
resolver = "3"

[dependencies]
nara = { path = "../..", default-features = false, features = ["project-runtime", "serde"] }
nara_physics2d = { path = "../../crates/nara_physics2d" }
nara_render = { path = "../../crates/nara_render", features = ["animation"], optional = true }
notify = { version = "=8.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = { version = "=3.5.1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }
rtrb = { version = "=0.3.5", optional = true }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", optional = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
cpal = { version = "=0.18.2", default-features = false, optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["development"]
local-player = ["nara/runtime-2d", "dep:nara_render", "dep:hound"]
development = ["local-player", "nara/project-tooling", "dep:notify"]
audio-cpal = ["local-player", "dep:cpal", "dep:rtrb"]
desktop = ["local-player", "nara/presentation-2d", "nara/desktop-winit", "nara/render-wgpu", "dep:wgpu"]
play-flow = ["desktop", "nara/presentation-ui"]
play-flow-check = ["development", "play-flow", "dep:windows-sys"]
gamepad = ["desktop", "nara/gamepad"]
cost-measurement = ["dep:windows-sys"]
scene-work-observation = ["nara/scene-work-observation", "dep:tracing", "dep:tracing-subscriber"]
cook = ["local-player", "nara/project-tooling"]
cooked-player = ["local-player"]
cooked-server = []

[lib]
name = "two_level_game"
path = "src/lib.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"
required-features = ["development"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
required-features = ["development"]
test = false
bench = false

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["development", "desktop"]

[[bin]]
name = "play_flow_check"
path = "src/bin/play_flow_check.rs"
required-features = ["play-flow-check"]
test = false
bench = false

[[bin]]
name = "audio_desktop"
path = "src/bin/audio_desktop.rs"
required-features = ["development", "desktop", "audio-cpal"]
test = false
bench = false

[[bin]]
name = "continuity"
path = "src/bin/continuity.rs"
required-features = ["development"]
test = true
bench = false

[[bin]]
name = "develop"
path = "src/bin/develop.rs"
required-features = ["development"]
test = true
bench = false

[[bin]]
name = "desktop_control"
path = "src/bin/desktop_control.rs"
required-features = ["development", "desktop"]
test = false
bench = false

[[bin]]
name = "desktop_reconstruction"
path = "src/bin/desktop_reconstruction.rs"
required-features = ["development", "desktop"]
test = false
bench = false

[[bin]]
name = "runtime_cost"
path = "src/bin/runtime_cost.rs"
required-features = ["development", "desktop", "cost-measurement"]
test = false
bench = false

[[bin]]
name = "runtime_workload"
path = "src/bin/runtime_workload.rs"
required-features = ["desktop", "cost-measurement"]
test = false
bench = false

[[bin]]
name = "cook"
path = "src/bin/cook.rs"
required-features = ["cook"]
test = false
bench = false

[[bin]]
name = "player"
path = "src/bin/player.rs"
required-features = ["cooked-player"]
test = false
bench = false

[[bin]]
name = "player_desktop"
path = "src/bin/player_desktop.rs"
required-features = ["cooked-player", "desktop"]
test = false
bench = false

[[bin]]
name = "player_audio"
path = "src/bin/player_audio.rs"
required-features = ["cooked-player", "desktop", "audio-cpal"]
test = false
bench = false

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["cooked-server"]
test = true
bench = false

[patch.crates-io]
winit = { path = "../../vendor/winit" }
