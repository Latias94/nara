[package]
name = "two-level-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[package.metadata.nara]
project-tool-protocol = 1

[workspace]
resolver = "3"

[dependencies]
nara = { path = "../..", default-features = false, features = ["runtime-2d", "serde"] }
notify = { version = "=8.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", optional = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[features]
default = ["development"]
development = ["nara/project-tooling", "dep:notify"]
desktop = ["nara/presentation-2d", "nara/desktop-winit", "nara/render-wgpu", "dep:wgpu"]
cost-measurement = ["dep:windows-sys"]
cook = ["nara/project-tooling"]
cooked-player = []

[lib]
name = "two_level_game"
path = "src/lib.rs"

[[bin]]
name = "headless"
path = "src/bin/headless.rs"
required-features = ["development"]

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["development", "desktop"]

[[bin]]
name = "continuity"
path = "src/bin/continuity.rs"
required-features = ["development"]
test = true
bench = false

[[bin]]
name = "develop"
path = "src/bin/develop.rs"
required-features = ["development"]
test = true
bench = false

[[bin]]
name = "desktop_control"
path = "src/bin/desktop_control.rs"
required-features = ["development", "desktop"]
test = false
bench = false

[[bin]]
name = "desktop_reconstruction"
path = "src/bin/desktop_reconstruction.rs"
required-features = ["development", "desktop"]
test = false
bench = false

[[bin]]
name = "runtime_cost"
path = "src/bin/runtime_cost.rs"
required-features = ["development", "desktop", "cost-measurement"]
test = false
bench = false

[[bin]]
name = "runtime_workload"
path = "src/bin/runtime_workload.rs"
required-features = ["desktop", "cost-measurement"]
test = false
bench = false

[[bin]]
name = "cook"
path = "src/bin/cook.rs"
required-features = ["cook"]
test = false
bench = false

[[bin]]
name = "player"
path = "src/bin/player.rs"
required-features = ["cooked-player"]
test = false
bench = false

[[bin]]
name = "player_desktop"
path = "src/bin/player_desktop.rs"
required-features = ["cooked-player", "desktop"]
test = false
bench = false

[patch.crates-io]
notify = { path = "../../vendor/notify" }
winit = { path = "../../vendor/winit" }
