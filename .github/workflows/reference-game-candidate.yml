name: Reference Game Candidate

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "reference-game-candidate-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  candidate-build:
    name: "Candidate build (${{ matrix.platform }})"
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary_suffix: ""
          - os: windows-latest
            platform: windows-x86_64
            binary_suffix: .exe
    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python packager
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.13.5
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Build headless product
        run: cargo build --manifest-path reference-game/Cargo.toml --locked --release --bin headless
      - name: Build desktop product and probe
        run: cargo build --manifest-path reference-game/Cargo.toml --locked --release --features desktop --bin desktop --bin desktop_render_probe
      - name: Create bounded candidate
        run: python -B reference-game/tools/package.py create --repository-root . --platform "${{ matrix.platform }}" --version 0.1.0 --source-revision "${{ github.sha }}" --headless-binary "reference-game/target/release/headless${{ matrix.binary_suffix }}" --desktop-binary "reference-game/target/release/desktop${{ matrix.binary_suffix }}" --desktop-probe-binary "reference-game/target/release/desktop_render_probe${{ matrix.binary_suffix }}" --output "${{ runner.temp }}/nara-reference-game-${{ matrix.platform }}.zip" --receipt "${{ runner.temp }}/nara-reference-game-${{ matrix.platform }}.json"
      - name: Create no-checkout transport
        run: python -B reference-game/tools/package.py bundle --repository-root . --archive "${{ runner.temp }}/nara-reference-game-${{ matrix.platform }}.zip" --receipt "${{ runner.temp }}/nara-reference-game-${{ matrix.platform }}.json" --output "${{ runner.temp }}/candidate-bundle-${{ matrix.platform }}"
      - name: Upload candidate transport
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "nara-reference-game-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/candidate-bundle-${{ matrix.platform }}"
          if-no-files-found: error
          retention-days: "14"
          compression-level: "0"
          include-hidden-files: "false"

  candidate-consumer:
    name: "Candidate consumer (${{ matrix.platform }})"
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}"
    needs: candidate-build
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            binary_suffix: ""
          - os: windows-latest
            platform: windows-x86_64
            binary_suffix: .exe
    steps:
      - name: Set up Python consumer
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.13.5
      - name: Download exact candidate transport
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: "nara-reference-game-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/candidate-bundle"
      - name: Verify candidate transport before extraction
        run: python -B "${{ runner.temp }}/candidate-bundle/verification/reference-game/tools/smoke_artifact.py" bundle-verify --bundle "${{ runner.temp }}/candidate-bundle" --expected-platform "${{ matrix.platform }}" --expected-source-revision "${{ github.sha }}"
      - name: Install Linux software display and Vulkan fallback
        if: "${{ runner.os == 'Linux' }}"
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb mesa-vulkan-drivers vulkan-tools
      - name: Smoke Linux candidate
        if: "${{ runner.os == 'Linux' }}"
        run: python -B "${{ runner.temp }}/candidate-bundle/verification/reference-game/tools/smoke_artifact.py" bundle-smoke --bundle "${{ runner.temp }}/candidate-bundle" --work-root "${{ runner.temp }}" --expected-platform "${{ matrix.platform }}" --expected-source-revision "${{ github.sha }}" --desktop-launcher-json '["xvfb-run","--auto-servernum","--server-args=-screen 0 1280x720x24"]' --desktop-environment NARA_WGPU_FORCE_FALLBACK=1
      - name: Smoke Windows candidate
        if: "${{ runner.os == 'Windows' }}"
        run: python -B "${{ runner.temp }}/candidate-bundle/verification/reference-game/tools/smoke_artifact.py" bundle-smoke --bundle "${{ runner.temp }}/candidate-bundle" --work-root "${{ runner.temp }}" --expected-platform "${{ matrix.platform }}" --expected-source-revision "${{ github.sha }}" --desktop-environment NARA_WGPU_FORCE_FALLBACK=1
