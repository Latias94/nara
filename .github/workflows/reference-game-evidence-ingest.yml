name: Reference Game Evidence Ingest Preparation

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "reference-game-evidence-ingest-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  policy:
    name: Verify pinned evidence-ingest policy
    if: "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned helper and schema
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          REVIEWED_SOURCE_REVISION: 0c23f48d93ebb66c46377db30ce889943c0d2d63
          HELPER_PATH: reference-game/tools/ingest_evidence.py
          HELPER_BLOB: 49a8604b4466c38d13884e67131198e744323150
          HELPER_SHA256: 8fac0fbb409b622e0695e26e42fdc0db9698956881abc72805049068f16ae1f2
          SCHEMA_PATH: docs/benchmarks/data/envelope/v1/normalized-evidence.schema.json
          SCHEMA_BLOB: e6b22a9d818a3b7445396da5e8ea05a33348de06
          SCHEMA_SHA256: 5ce8ff142febef0d8d844617622ff6ee9f6de4efc5718c2007b260786b17ee28
          POLICY_ROOT: "${{ runner.temp }}/nara-evidence-ingest-policy"
        with:
          script: |
            const crypto = require("crypto");
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const reviewedRevision = process.env.REVIEWED_SOURCE_REVISION;
            const policyRoot = process.env.POLICY_ROOT;
            const files = [
              {
                path: process.env.HELPER_PATH,
                blob: process.env.HELPER_BLOB,
                sha256: process.env.HELPER_SHA256,
                output: "ingest_evidence.py",
              },
              {
                path: process.env.SCHEMA_PATH,
                blob: process.env.SCHEMA_BLOB,
                sha256: process.env.SCHEMA_SHA256,
                output: "normalized-evidence.schema.json",
              },
            ];

            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main",
            });
            if (!branch.data.protected || branch.data.commit.sha !== context.sha) {
              throw new Error("policy preparation requires the current protected main revision");
            }

            const comparison = await github.rest.repos.compareCommits({
              owner,
              repo,
              base: reviewedRevision,
              head: context.sha,
            });
            if (!["ahead", "identical"].includes(comparison.data.status)) {
              throw new Error("reviewed helper revision is not an ancestor of the dispatch revision");
            }

            fs.mkdirSync(policyRoot, { recursive: false });
            for (const file of files) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: file.path,
                ref: reviewedRevision,
              });
              if (
                Array.isArray(response.data) ||
                response.data.type !== "file" ||
                response.data.sha !== file.blob ||
                response.data.encoding !== "base64" ||
                typeof response.data.content !== "string"
              ) {
                throw new Error("reviewed policy source did not match its pinned blob");
              }

              const bytes = Buffer.from(response.data.content.replace(/\n/g, ""), "base64");
              const sha256 = crypto.createHash("sha256").update(bytes).digest("hex");
              if (sha256 !== file.sha256) {
                throw new Error("reviewed policy source did not match its pinned digest");
              }
              fs.writeFileSync(path.join(policyRoot, file.output), bytes, { flag: "wx" });
            }
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.13.5
      - name: Verify pinned normalization policy
        run: python -B "${{ runner.temp }}/nara-evidence-ingest-policy/ingest_evidence.py" verify-policy --schema "${{ runner.temp }}/nara-evidence-ingest-policy/normalized-evidence.schema.json"
