name: CI

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  root:
    name: "Root (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup default 1.95.0
      - name: Install nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - name: Install root system test profile
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libx11-6 libx11-xcb1 libxcb1 libxcursor1 libxi6 libxkbcommon0 libxkbcommon-x11-0 mesa-vulkan-drivers vulkan-tools xauth xvfb
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check root workspace
        run: cargo check --workspace --locked --all-targets
      - name: Check root feature matrix
        shell: bash
        run: |
          cargo check -p nara --locked --no-default-features --lib
          cargo check -p nara --locked --no-default-features --features runtime-core --lib
          cargo check -p nara --locked --no-default-features --features runtime-2d --lib
          cargo check -p nara --locked --no-default-features --features presentation-2d --lib
          cargo check -p nara --locked --no-default-features --features runtime-ui --lib
          cargo check -p nara --locked --no-default-features --features presentation-ui --lib
          cargo check -p nara --locked --no-default-features --features tooling --lib
          cargo check -p nara --locked --no-default-features --features asset-watch --lib
          cargo check -p nara --locked --no-default-features --features desktop-winit --lib
          cargo check -p nara --locked --no-default-features --features render-wgpu --lib
          cargo check -p nara --locked --no-default-features --features serde --lib
          cargo check -p nara --locked --no-default-features --features project-tooling --lib
          cargo check -p nara --locked --no-default-features --features runtime-core,serde --lib
          cargo check -p nara --locked --no-default-features --features runtime-2d,serde --lib
          cargo check -p nara --locked --no-default-features --features runtime-ui,serde --lib
          cargo check -p nara --locked --no-default-features --features tooling,runtime-2d,serde --lib
          cargo check -p nara --locked --no-default-features --features desktop-winit,render-wgpu --example windowed_clear
          cargo check -p nara --locked --no-default-features --features presentation-2d,desktop-winit,render-wgpu --example windowed_sprites
          cargo check -p nara --locked --no-default-features --features presentation-2d,desktop-winit,render-wgpu --example palette_material
          cargo run -p nara_ui_kernel --locked --example layout_gallery
          cargo run -p nara_ui --locked --example interaction_lab
          cargo run -p nara --locked --no-default-features --features presentation-ui,desktop-winit,render-wgpu --example ui_presentation_gallery
          CARGO_TARGET_DIR=target cargo check --manifest-path tests/fixtures/product-slices/presentation-2d/Cargo.toml --locked
          CARGO_TARGET_DIR=target cargo check --manifest-path tests/fixtures/product-slices/presentation-ui/Cargo.toml --locked
          cargo check --workspace --locked --all-features --all-targets
      - name: Test root workspace
        shell: bash
        run: |
          cargo nextest run --workspace --locked --test-threads=1
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            NARA_WGPU_FORCE_FALLBACK=1 xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" cargo nextest run --workspace --locked --all-features --test-threads=1
          else
            NARA_WGPU_FORCE_FALLBACK=1 cargo nextest run --workspace --locked --all-features --test-threads=1
          fi
      - name: Test production Dear renderer adapter
        shell: bash
        env:
          DEAR_IMGUI_REQUIRE_WGPU_ADAPTER: "1"
          NARA_WGPU_FORCE_FALLBACK: "1"
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" cargo nextest run -p nara_render_wgpu --locked --features editor-imgui --lib --test-threads=1
          else
            cargo nextest run -p nara_render_wgpu --locked --features editor-imgui --lib --test-threads=1
          fi

  reference-game:
    name: "Reference game (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Install nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - name: Install reference-game system test profile
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libx11-6 libx11-xcb1 libxcb1 libxcursor1 libxi6 libxkbcommon0 libxkbcommon-x11-0 mesa-vulkan-drivers vulkan-tools xauth xvfb
          fi
      - name: Check reference game
        run: cargo check --manifest-path reference-game/Cargo.toml --locked --all-targets
      - name: Check reference game all features
        run: cargo check --manifest-path reference-game/Cargo.toml --locked --all-features --all-targets
      - name: Test reference game
        run: cargo nextest run --manifest-path reference-game/Cargo.toml --locked --test-threads=1
      - name: Test reference game all features
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            NARA_WGPU_FORCE_FALLBACK=1 xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" cargo nextest run --manifest-path reference-game/Cargo.toml --locked --all-features --test-threads=1
          else
            NARA_WGPU_FORCE_FALLBACK=1 cargo nextest run --manifest-path reference-game/Cargo.toml --locked --all-features --test-threads=1
          fi

  module-consumer:
    name: "Module consumer (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: "${{ github.workspace }}/target"
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Install nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - name: Check module consumer formatting
        run: cargo fmt --manifest-path tests/fixtures/module-consumer/Cargo.toml --all -- --check
      - name: Check module consumer
        run: cargo check --manifest-path tests/fixtures/module-consumer/Cargo.toml --locked --workspace --all-targets
      - name: Lint module consumer
        run: cargo clippy --manifest-path tests/fixtures/module-consumer/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - name: Check UI module consumer formatting
        run: cargo fmt --manifest-path tests/fixtures/ui-module-consumer/Cargo.toml --all -- --check
      - name: Check UI module consumer
        run: cargo check --manifest-path tests/fixtures/ui-module-consumer/Cargo.toml --locked --all-targets
      - name: Test UI module consumer
        run: cargo nextest run --manifest-path tests/fixtures/ui-module-consumer/Cargo.toml --locked --test-threads=1
      - name: Test direct module surfaces
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo nextest run --manifest-path tests/fixtures/module-consumer/Cargo.toml --locked --workspace --test-threads=1
          else
            cargo nextest run --manifest-path tests/fixtures/module-consumer/Cargo.toml --locked -p nara-scene-module-consumer -p nara-material-module-consumer --test-threads=1
            cargo nextest run --manifest-path tests/fixtures/module-consumer/Cargo.toml --locked -p nara-editor-panel-module-consumer --test-threads=1
          fi
      - name: Check Collect Game sample all features
        run: cargo check --manifest-path samples/collect-game/Cargo.toml --locked --workspace --all-features --all-targets
      - name: Test Collect Game sample headless
        run: cargo nextest run --manifest-path samples/collect-game/Cargo.toml --workspace --locked --test-threads=1
