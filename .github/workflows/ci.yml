name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - refactor/v2-clean-architecture

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path reference-game/Cargo.toml --all -- --check
      - run: >-
          rustfmt --check --edition 2024
          crates/nara_editor/build.rs crates/nara_editor/src/main.rs
          crates/nara_editor_viewport/src/lib.rs examples/shared-viewport/src/main.rs

  workspace:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.13.17
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Check dependency and source boundaries
        run: python ci/check_boundaries.py
      - name: Resolve a single WGPU package
        run: cargo tree --locked --workspace --all-features --invert wgpu --depth 1
      - run: cargo check --workspace --locked --all-features --all-targets

  engine-tests:
    name: Core engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - name: Install Linux gamepad and software Vulkan dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev mesa-vulkan-drivers pkg-config
      - name: Test core engine crates
        run: >-
          cargo nextest run --locked -p nara_app -p nara_asset -p nara_editor_core
          -p nara_input -p nara_scene -p nara_core -p nara_audio -p nara_physics2d -p nara_project
          -p nara_reflect -p nara_render -p nara_ui --lib --bin nara --test vfs --test mock_audio
          --test fixed_physics --test lifecycle --test code_first_images --test direct_input
          --test schema_registration --test kernel --test text --test clip --test generation_workflow
          --test spatial_presentation --test editor_session --test project_authoring --test compact_asset_reference --test authoring
          --test prefab --test schema_v2 --test project_asset_database --test compact_float_defaults --test derive_ui
          --test cooked --test cooked_assets --test import_cache --test import_image --test runtime_loading --test runtime_sprite_assets --test runtime_scene
          --features nara_asset/tasks,nara_asset/cook,nara_asset/image-import,nara_asset/hot-reload,nara_input/gamepad,nara_project/delivery,nara_scene/cook,nara_scene/runtime,nara_scene/save,nara_reflect/serde,nara_reflect/postcard,nara_render/animation,nara_render/material-authoring,nara_render/sprite-render,nara_render/sprite-source-hydration,nara_ui/runtime
          --no-tests fail --no-fail-fast
      - name: Test offscreen WGPU passes on software Vulkan
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          NARA_WGPU_FORCE_FALLBACK: "1"
        run: >-
          cargo nextest run --locked -p nara_render --lib --test ordered_hierarchy
          --features wgpu,sprite-render,hud-runtime --run-ignored only
          --no-tests fail --no-fail-fast --test-threads 1
      - name: Test the editor overlay on software Vulkan
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: vulkan
          NARA_WGPU_FORCE_FALLBACK: "1"
        run: >-
          cargo nextest run --locked -p nara_editor_gizmo --run-ignored all
          --no-tests fail --no-fail-fast --test-threads 1

  reference-game:
    name: Reference game
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - name: Build desktop and test the game
        run: >-
          cargo nextest run --manifest-path reference-game/Cargo.toml --locked --features desktop
          --no-tests fail
      - name: Check the standalone game target
        run: >-
          cargo check --manifest-path reference-game/Cargo.toml --locked --no-default-features
          --features desktop --bin game

  wasm-core:
    name: Wasm core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo check -p nara --locked --no-default-features --features runtime-core --lib --target wasm32-unknown-unknown
