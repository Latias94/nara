name: CI

"on":
  pull_request:
  push:
    branches:
      - main
      - refactor/v2-clean-architecture

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.95.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path reference-game/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path samples/two-level-game/Cargo.toml --all -- --check

  workspace:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: 3.13.5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libudev-dev pkg-config
      - name: Check dependency and source boundaries
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python ci/check_boundaries.py
      - name: Resolve a single WGPU package
        run: cargo tree --locked -d -p wgpu
      - run: cargo check --workspace --locked --all-features
      - name: Test core engine crates
        run: >-
          cargo nextest run --locked -p nara_app -p nara_asset_watch -p nara_editor_core
          -p nara_input -p nara_scene --lib --features nara_input/serde,nara_scene/serde --no-tests fail

  reference-game:
    name: Reference game
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.138
          fallback: none
      - name: Build desktop and test the game
        run: >-
          cargo nextest run --manifest-path reference-game/Cargo.toml --locked --features desktop
          --test headless_cli --test headless_snapshot --test ui_product --test desktop_flow
          --no-tests fail

  wasm-core:
    name: Wasm core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo check -p nara --locked --no-default-features --features runtime-core --lib --target wasm32-unknown-unknown
