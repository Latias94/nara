schema_version = 1

[project]
name = "Nara Reference Game"
stable_id = "nara-reference-game"
version = "0.1.0"

[paths]
assets = "assets"
scenes = "scenes"
prefabs = "prefabs"

[startup]
default_scene = "startup.scene.json"

[runtime]
preset = "local-headless"
fixed_timestep_seconds = 0.02

[capabilities]
requested = ["runtime-2d"]

[profiles.desktop.capabilities]
requested = ["runtime-2d", "runtime-ui", "desktop-winit", "render-wgpu"]

[profiles.desktop.runtime]
preset = "local-headless"
fixed_timestep_seconds = 0.1

[profiles.desktop.window]
enabled = true
title = "Nara Reference Wave"
width = 1280
height = 720
present_mode = "fifo"
resizable = true
