[package]
name = "nara-reference-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
desktop = [
    "nara/presentation-2d",
    "nara/presentation-ui",
    "nara/desktop-winit",
    "nara/render-wgpu",
]
desktop-accessibility-probe = ["desktop", "dep:windows"]
editor = ["nara/tooling"]
editor-game-view-canary = ["desktop", "editor", "dep:nara-editor"]
host-parity = ["desktop", "editor"]

[workspace]
resolver = "3"

[dependencies]
nara = { path = "..", default-features = false, features = ["runtime-2d", "runtime-ui", "serde"] }
nara-editor = { path = "../editor", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
accesskit = "0.24.1"
nara_render = { path = "../crates/nara_render" }
nara_ui = { path = "../crates/nara_ui" }
nara_ui_kernel = { path = "../crates/nara_ui_kernel" }
nara_ui_render = { path = "../crates/nara_ui_render" }
nara_winit = { path = "../crates/nara_winit", features = ["accessibility"] }
serde_json = "1"

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "desktop_render_probe"
path = "src/bin/desktop_render_probe.rs"
required-features = ["desktop"]

[[bin]]
name = "desktop_accessibility_probe"
path = "src/bin/desktop_accessibility_probe.rs"
required-features = ["desktop-accessibility-probe"]

[[bin]]
name = "host_parity_probe"
path = "src/bin/host_parity_probe.rs"
required-features = ["host-parity"]

[[bin]]
name = "editor_game_view_canary"
path = "src/bin/editor_game_view_canary.rs"
required-features = ["editor-game-view-canary"]
