[package]
name = "nara-reference-game"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.nara]
project-tool-protocol = 1

[features]
default = []
desktop = [
    "nara/presentation-2d",
    "nara/presentation-ui",
    "nara/desktop-winit",
    "nara/render-wgpu",
]

[workspace]
resolver = "3"

[dependencies]
nara = { path = "..", default-features = false, features = ["runtime-2d", "runtime-ui", "serde", "project-tooling"] }

[dev-dependencies]
nara_render = { path = "../crates/nara_render", features = ["hud-runtime"] }
nara_ui = { path = "../crates/nara_ui" }
nara_ui_kernel = { path = "../crates/nara_ui_kernel" }
serde_json = "1"

[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "desktop_render_probe"
path = "src/bin/desktop_render_probe.rs"
required-features = ["desktop"]

[[bin]]
name = "authoring_bundle"
path = "src/bin/authoring_bundle.rs"

[patch.crates-io]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
winit = { path = "../vendor/winit" }
