[package]
name = "nara-runtime-scene-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
scene-work-observation = ["nara_scene/work-observation", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
nara_core = { path = "../../../../../crates/nara_core" }
nara_ecs = { path = "../../../../../crates/nara_ecs" }
nara_identity = { path = "../../../../../crates/nara_identity", features = ["runtime"] }
nara_reflect = { path = "../../../../../crates/nara_reflect", features = ["serde"] }
nara_scene = { path = "../../../../../crates/nara_scene", features = ["serde"] }
serde_json = "1"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"], optional = true }
