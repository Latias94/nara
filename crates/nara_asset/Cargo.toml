[package]
name = "nara_asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
image = { workspace = true, optional = true }
nara_app = { workspace = true, optional = true }
nara_core.workspace = true
nara_ecs = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
notify = { workspace = true, optional = true }

[dev-dependencies]
ron.workspace = true
serde_json.workspace = true

[target.'cfg(any(unix, windows))'.dev-dependencies]
tempfile = "3.27"

[features]
default = []
hot-reload = ["image-import", "dep:notify"]
image-import = ["runtime", "dep:image"]
runtime = ["dep:nara_app", "dep:nara_ecs"]
serde = ["dep:serde", "nara_core/serde"]
