[package]
name = "nara_asset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy_ecs = { workspace = true, optional = true }
blake3.workspace = true
nara_app = { workspace = true, optional = true }
nara_core.workspace = true
nara_ecs = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
nara_app = { workspace = true, features = ["tasks"] }
ron.workspace = true
serde_json.workspace = true

[features]
default = []
hot-reload = ["runtime", "dep:notify", "nara_app/diagnostics"]
runtime = ["dep:bevy_ecs", "dep:nara_app", "dep:nara_ecs", "dep:thiserror"]
serde = ["dep:serde", "dep:serde_json", "nara_core/serde"]
