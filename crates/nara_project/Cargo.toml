[package]
name = "nara_project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nara_core.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
blake3 = { workspace = true, optional = true }
ctrlc = { version = "3.5", optional = true }
nara_asset = { workspace = true, optional = true, features = ["authoring"] }
nara_audio = { workspace = true, optional = true }
nara_reflect = { workspace = true, optional = true, features = ["serde"] }
nara_render = { workspace = true, optional = true, features = ["material-authoring"] }
nara_scene = { workspace = true, optional = true, features = ["cook"] }
nara_ui = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { version = "3.27", optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "0.2", optional = true }
rustix = { version = "1.1", optional = true, default-features = false, features = ["fs", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
default = ["delivery"]
delivery = [
    "workflow",
    "dep:blake3",
    "dep:nara_audio",
    "dep:nara_render",
    "dep:nara_scene",
    "dep:nara_ui",
    "dep:rustix",
    "dep:tempfile",
    "nara_asset/cook",
    "windows-sys/Win32_Storage_FileSystem",
]
workflow = [
    "dep:ctrlc",
    "dep:libc",
    "dep:nara_asset",
    "dep:nara_reflect",
    "dep:serde_json",
    "dep:thiserror",
    "dep:windows-sys",
]

[[bin]]
name = "nara"
path = "src/bin/nara.rs"
required-features = ["workflow"]
