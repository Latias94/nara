[package]
name = "nara_project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
nara_app = { workspace = true, features = ["tasks"] }
nara_asset = { workspace = true, optional = true, features = ["pack"] }
nara_core = { workspace = true, features = ["serde"] }
nara_ecs.workspace = true
nara_scene = { workspace = true, features = ["runtime-configuration"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
ctrlc = { version = "3.5", optional = true }
nara_input = { workspace = true, optional = true, features = ["serde"] }
nara_reflect = { workspace = true, optional = true, features = ["serde"] }
uuid = { workspace = true, optional = true, features = ["v4"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
default = ["workflow"]
manifest-source = ["nara_core/fs-capabilities"]
cargo-build = ["cargo-facts", "dep:blake3"]
cargo-facts = ["manifest-source"]
player-package = ["cargo-build", "dep:getrandom", "dep:nara_asset", "nara_scene/runtime-catalog"]
product-process = [
    "dep:rustix",
    "dep:windows-sys",
    "manifest-source",
    "windows-sys/Win32_Globalization",
    "windows-sys/Win32_Security_Cryptography",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_IO",
]
workflow = ["dep:ctrlc", "dep:libc", "dep:nara_input", "dep:nara_reflect", "dep:uuid", "dep:windows-sys"]

[[bin]]
name = "nara"
path = "src/bin/nara.rs"
required-features = ["workflow"]
