[package]
name = "nara_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3 = { workspace = true, optional = true }
getrandom.workspace = true
glam.workspace = true
semver.workspace = true
uuid.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[target.'cfg(any(unix, windows))'.dependencies]
tempfile = "3.27"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
ron.workspace = true
serde_json.workspace = true

[features]
default = []
fs-capabilities = ["dep:blake3", "dep:rustix", "dep:windows-sys"]
serde = ["dep:serde"]

[[test]]
name = "filesystem_contract"
required-features = ["fs-capabilities"]

[[test]]
name = "path_contract"
required-features = ["fs-capabilities"]
