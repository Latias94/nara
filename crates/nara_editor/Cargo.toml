[package]
name = "nara_editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = ["../nara_editor_viewport"]

[dependencies]
anyhow = "1"
nara_core = { path = "../nara_core" }
nara_editor_core = { path = "../nara_editor_core" }
nara_editor_gizmo = { path = "../nara_editor_gizmo" }
nara_editor_viewport = { path = "../nara_editor_viewport" }
nara_project = { path = "../nara_project" }
nara_reflect = { path = "../nara_reflect" }
nara_scene = { path = "../nara_scene", features = ["authoring"] }
open_gpui = { package = "open-gpui", path = "../../../open-gpui/crates/gpui", default-features = false }
open_gpui_base = { package = "open-gpui-base", path = "../../../open-gpui/crates/gpui_base" }
open_gpui_docking = { package = "open-gpui-docking", path = "../../../open-gpui/crates/gpui_docking" }
open_gpui_platform = { package = "open-gpui-platform", path = "../../../open-gpui/crates/gpui_platform" }
open_gpui_wgpu = { package = "open-gpui-wgpu", path = "../../../open-gpui/crates/gpui_wgpu" }
pollster = "0.4"
tempfile = "3.27"
uuid = { version = "1.23.4", features = ["v4"] }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }

[target.'cfg(target_os = "macos")'.dependencies]
open_gpui_platform = { package = "open-gpui-platform", path = "../../../open-gpui/crates/gpui_platform", features = ["font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
open_gpui_platform = { package = "open-gpui-platform", path = "../../../open-gpui/crates/gpui_platform", features = ["wayland", "x11"] }

[target.'cfg(windows)'.dev-dependencies]
open_gpui = { package = "open-gpui", path = "../../../open-gpui/crates/gpui", default-features = false, features = ["test-support"] }

[patch.crates-io]
accesskit_windows = { path = "../../../open-gpui/third_party/accesskit_windows" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
