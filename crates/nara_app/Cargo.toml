[package]
name = "nara_app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy_platform = { version = "=0.20.0", default-features = false }
bevy_tasks = { workspace = true, optional = true }
nara_core = { workspace = true, optional = true }
nara_ecs.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_tasks = { workspace = true, features = ["multi_threaded"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_platform = { version = "=0.20.0", default-features = false, features = ["web"] }

[features]
default = []
diagnostics = ["dep:nara_core", "dep:tracing"]
parallel-executor = ["dep:bevy_tasks", "bevy_tasks/multi_threaded", "nara_ecs/parallel-executor"]
tasks = ["dep:bevy_tasks", "bevy_tasks/async_executor"]

[dev-dependencies]
bevy_ecs.workspace = true
