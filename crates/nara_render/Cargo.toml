[package]
name = "nara_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
bytemuck = { workspace = true, optional = true }
encase = { workspace = true, optional = true }
glam = { workspace = true, optional = true, features = ["encase-012"] }
guillotiere = { workspace = true, optional = true }
naga = { workspace = true, optional = true }
nara_app = { workspace = true, optional = true }
nara_asset.workspace = true
nara_core.workspace = true
nara_diagnostic = { workspace = true, optional = true }
nara_ecs = { workspace = true, optional = true }
nara_fs = { workspace = true, optional = true }
nara_hierarchy = { workspace = true, optional = true }
nara_material_derive = { workspace = true, optional = true }
nara_reflect = { workspace = true, optional = true }
nara_tasks = { workspace = true, optional = true }
nara_text = { workspace = true, optional = true }
nara_transform = { workspace = true, optional = true }
nara_ui_kernel = { workspace = true, optional = true }
nara_window.workspace = true
png = { version = "=0.18.1", optional = true }
pollster = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true
nara_input.workspace = true
nara_tasks.workspace = true
raw-window-handle.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dev-dependencies]
winit.workspace = true

[features]
default = []
runtime = [
    "dep:nara_app",
    "dep:nara_ecs",
    "dep:nara_hierarchy",
    "dep:nara_reflect",
    "dep:nara_transform",
    "nara_asset/runtime",
    "nara_window/runtime",
]
serde = [
    "dep:ron",
    "dep:serde",
    "dep:serde_json",
    "nara_asset/serde",
    "nara_core/serde",
    "nara_diagnostic?/serde",
    "nara_window/serde",
]
image = ["dep:nara_diagnostic"]
image-runtime = ["image", "runtime", "dep:nara_fs", "dep:nara_tasks", "dep:png", "nara_diagnostic/runtime"]
render-prepare = ["image"]
material = ["image", "dep:encase", "dep:glam", "dep:naga", "dep:nara_ecs", "dep:nara_material_derive"]
material-asset = ["material", "serde"]
persistent = ["material-asset", "runtime"]
sprites = ["runtime", "image", "material"]
tiles = ["runtime", "image", "material"]
animation = ["sprites", "serde"]
sprite-render = ["sprites", "tiles", "persistent", "image-runtime", "render-prepare"]
hud = ["render-prepare", "dep:guillotiere", "dep:nara_text", "dep:nara_ui_kernel"]
hud-runtime = ["hud", "runtime", "image-runtime"]
wgpu = ["runtime", "material", "dep:bytemuck", "dep:pollster", "dep:wgpu"]

[[test]]
name = "generation_workflow"
required-features = ["material"]
