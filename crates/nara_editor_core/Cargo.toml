[package]
name = "nara_editor_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
nara_asset.workspace = true
nara_core.workspace = true
nara_project.workspace = true
nara_reflect.workspace = true
nara_scene = { workspace = true, features = ["authoring"] }
ron.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nara_project = { workspace = true, features = ["workflow"] }
tempfile = "3.27"

[target.'cfg(any(unix, windows))'.dependencies]
nara_asset = { workspace = true, features = ["authoring"] }

[dev-dependencies]
tempfile = "3.27"
