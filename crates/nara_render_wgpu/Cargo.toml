[package]
name = "nara_render_wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dear-imgui-rs = { workspace = true, optional = true }
dear-imgui-wgpu = { workspace = true, optional = true }
dear-imgui-winit = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
nara_app.workspace = true
nara_ecs.workspace = true
nara_image = { workspace = true, optional = true, features = ["render-prepare"] }
nara_material = { workspace = true, optional = true }
nara_render.workspace = true
nara_sprite_render = { workspace = true, optional = true }
nara_ui_render = { workspace = true, optional = true }
nara_window.workspace = true
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit = { workspace = true, optional = true }

[dev-dependencies]
dear-imgui-winit.workspace = true
nara_asset.workspace = true
nara_core.workspace = true
nara_hierarchy.workspace = true
nara_reflect.workspace = true
nara_sprite.workspace = true
nara_tilemap.workspace = true
nara_text.workspace = true
nara_transform.workspace = true
nara_ui.workspace = true
nara_ui_kernel.workspace = true
raw-window-handle.workspace = true

[features]
default = []
editor-imgui = ["dep:dear-imgui-rs", "dep:dear-imgui-wgpu", "dep:dear-imgui-winit", "dep:winit"]
sprite-submitter = [
    "dep:bytemuck",
    "dep:nara_image",
    "dep:nara_material",
    "dep:nara_sprite_render",
]
ui-submitter = [
    "dep:bytemuck",
    "dep:nara_image",
    "dep:nara_material",
    "dep:nara_ui_render",
]
