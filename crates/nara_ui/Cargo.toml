[package]
name = "nara_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
icu_segmenter.workspace = true
nara_app = { workspace = true, optional = true }
nara_asset = { workspace = true, optional = true }
nara_ecs = { workspace = true, optional = true }
nara_input = { workspace = true, optional = true }
parley.workspace = true
swash.workspace = true
taffy.workspace = true
thiserror.workspace = true
ttf-parser.workspace = true

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["runtime"]
runtime = [
    "dep:nara_app",
    "dep:nara_asset",
    "nara_asset/runtime",
    "dep:nara_ecs",
    "dep:nara_input",
]
