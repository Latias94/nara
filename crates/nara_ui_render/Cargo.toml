[package]
name = "nara_ui_render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
guillotiere.workspace = true
nara_app = { workspace = true, optional = true }
nara_asset.workspace = true
nara_ecs = { workspace = true, optional = true }
nara_image = { workspace = true, features = ["render-prepare"] }
nara_render.workspace = true
nara_text.workspace = true
nara_ui_kernel.workspace = true
nara_window.workspace = true
thiserror.workspace = true

[dev-dependencies]
nara_core.workspace = true
nara_material.workspace = true

[features]
default = []
runtime = [
    "dep:nara_app",
    "dep:nara_ecs",
    "nara_asset/runtime",
    "nara_image/runtime",
    "nara_render/runtime",
    "nara_window/runtime",
]
