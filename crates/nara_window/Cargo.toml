[package]
name = "nara_window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bevy_ecs = { workspace = true, optional = true }
nara_app = { workspace = true, optional = true }
nara_ecs = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
nara_core = { workspace = true, optional = true }
nara_input = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
runtime = [
    "dep:bevy_ecs",
    "dep:nara_app",
    "dep:nara_ecs",
    "dep:raw-window-handle",
    "dep:thiserror",
]
serde = ["dep:serde"]
winit = ["runtime", "dep:nara_core", "dep:nara_input", "dep:windows-sys", "dep:winit"]
