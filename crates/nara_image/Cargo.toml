[package]
name = "nara_image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
nara_app = { workspace = true, optional = true }
nara_asset.workspace = true
nara_core.workspace = true
nara_diagnostic.workspace = true
nara_ecs = { workspace = true, optional = true }
nara_fs = { workspace = true, optional = true }
nara_render = { workspace = true, optional = true }
nara_tasks = { workspace = true, optional = true }
png = { version = "=0.18.1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true
nara_render.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
default = []
runtime = [
    "dep:nara_app",
    "dep:nara_ecs",
    "dep:nara_fs",
    "dep:nara_tasks",
    "dep:png",
    "nara_asset/runtime",
    "nara_diagnostic/runtime",
]
render-prepare = ["dep:nara_render"]
serde = [
    "dep:serde",
    "dep:serde_json",
    "nara_asset/serde",
    "nara_core/serde",
    "nara_diagnostic/serde",
    "nara_render?/serde",
]
