[package]
name = "nara_winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nara_app.workspace = true
nara_core.workspace = true
nara_ecs.workspace = true
nara_input.workspace = true
nara_window = { workspace = true, features = ["runtime"] }
winit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
nara_gameplay = { workspace = true, features = ["input"] }
nara_text.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
