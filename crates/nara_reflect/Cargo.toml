[package]
name = "nara_reflect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
blake3.workspace = true
bytemuck = { workspace = true, optional = true }
nara_app.workspace = true
nara_asset.workspace = true
nara_core.workspace = true
nara_ecs.workspace = true
nara_reflect_derive.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
uuid = { workspace = true, optional = true }

[dev-dependencies]
ron.workspace = true
trybuild.workspace = true

[features]
default = []
serde = ["dep:serde", "dep:serde_json", "nara_asset/serde"]
postcard = ["dep:bytemuck", "dep:postcard", "dep:serde", "dep:uuid"]
