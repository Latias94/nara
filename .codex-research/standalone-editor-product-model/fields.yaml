categories:
  product_experience:
    - name: "primary_editor_entry"
      description: "What the user launches and whether project-specific compilation is required before viewing or editing a scene."
      detail_level: "detailed"
    - name: "first_open_and_iteration"
      description: "Project discovery, open latency, script/code change loop, reload behavior, and failure recovery."
      detail_level: "detailed"
    - name: "authoring_coverage"
      description: "Scene, UI, animation, material/shader, asset, prefab, inspector, and debugging workflows."
      detail_level: "detailed"
  architecture:
    - name: "persistent_data_model"
      description: "How source assets, scenes, schemas, reflection metadata, and imported artifacts are represented and versioned."
      detail_level: "detailed"
    - name: "project_code_loading"
      description: "How project code becomes available to the editor and whether it is interpreted, managed, dynamically linked, statically linked, or isolated in another process."
      detail_level: "detailed"
    - name: "play_execution_model"
      description: "How Run/Play is built, started, stopped, debugged, restarted, and optionally embedded."
      detail_level: "detailed"
    - name: "editor_extension_model"
      description: "How custom inspectors, editor windows, asset importers, menus, gizmos, and domain-specific authoring tools are added."
      detail_level: "detailed"
    - name: "failure_and_versioning_model"
      description: "Missing code/schema, stale artifacts, migration, plugin failure, crash isolation, and compatibility behavior."
      detail_level: "detailed"
  engineering_tradeoffs:
    - name: "strengths"
      description: "Productivity and architectural strengths relevant to Nara."
      detail_level: "detailed"
    - name: "weaknesses"
      description: "Costs, complexity, lock-in, latency, or reliability weaknesses."
      detail_level: "detailed"
    - name: "nara_transferable_lessons"
      description: "Specific mechanisms Nara should copy, adapt, or reject."
      detail_level: "detailed"
    - name: "minimum_viable_path"
      description: "Smallest credible implementation path that preserves the mature-editor product experience."
      detail_level: "detailed"
  evidence:
    - name: "primary_sources"
      description: "Official documentation, source code, accepted Nara documents, or upstream repository references supporting the findings."
      detail_level: "detailed"
uncertain:
  - "Undocumented proprietary implementation details"
  - "Performance or latency claims without reproducible measurements"
