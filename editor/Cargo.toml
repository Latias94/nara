[package]
name = "nara-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["imgui-reference"]
imgui-reference = [
    "dep:dear-imgui-rs",
    "dep:dear-imgui-wgpu",
    "dep:dear-imgui-winit",
    "nara_render_wgpu/editor-imgui",
]
# Enables the private allocator only in the library test executable, for separate cost runs.
ui-work-allocation-probes = []

[[bin]]
name = "nara-editor"
path = "src/main.rs"
required-features = ["imgui-reference"]

[[bin]]
name = "nara-editor-drawn"
path = "src/drawn_main.rs"

[[test]]
name = "application_contract"
path = "tests/application_contract.rs"
required-features = ["imgui-reference"]

[[test]]
name = "authoring_loop"
path = "tests/authoring_loop.rs"
required-features = ["imgui-reference"]

[[test]]
name = "first_game_workflow"
path = "tests/first_game_workflow.rs"
required-features = ["imgui-reference"]

[[test]]
name = "panel_contributions"
path = "tests/panel_contributions.rs"
required-features = ["imgui-reference"]

[[test]]
name = "registered_panel_interactions"
path = "tests/registered_panel_interactions.rs"
required-features = ["imgui-reference"]

[dependencies]
dear-imgui-rs = { workspace = true, optional = true, features = ["system-clipboard"] }
dear-imgui-wgpu = { workspace = true, optional = true }
dear-imgui-winit = { workspace = true, optional = true }
nara = { path = "..", default-features = false, features = ["desktop-winit", "presentation-2d", "presentation-ui", "project-workflow-cargo-facts", "render-wgpu", "runtime-ui", "tooling"] }
nara_render_wgpu.workspace = true
nara_text.workspace = true
nara_ui_kernel.workspace = true
nara_ui_render = { workspace = true, features = ["runtime"] }
nara_ui_widgets.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
nara-stock-composition-consumer = { path = "../tests/fixtures/stock-composition-consumer" }
nara_reflect.workspace = true
nara_scene = { workspace = true, features = ["serde"] }
nara_tasks = { workspace = true, features = ["test-support"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
rustix = { workspace = true, features = ["event", "fs", "process"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
arboard = { version = "=3.7.0", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[target.'cfg(windows)'.dependencies]
dunce.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
