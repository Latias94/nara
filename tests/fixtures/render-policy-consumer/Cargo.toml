[package]
name = "nara-render-policy-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
nara = { path = "../../..", default-features = false, features = ["desktop-winit", "render-wgpu"] }
nara_app = { path = "../../../crates/nara_app", default-features = false }
nara_ecs = { path = "../../../crates/nara_ecs", default-features = false }
nara_render = { path = "../../../crates/nara_render", default-features = false }
nara_render_wgpu = { path = "../../../crates/nara_render_wgpu", default-features = false }

[dev-dependencies]
wgpu = "=30.0.1"
