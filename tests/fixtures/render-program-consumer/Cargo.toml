[package]
name = "nara-render-program-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"

[dependencies]
nara_render = { path = "../../../crates/nara_render", default-features = false, features = ["runtime"] }
nara_render_wgpu = { path = "../../../crates/nara_render_wgpu", default-features = false }

[dev-dependencies]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
