[package]
name = "nara-material-module-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
native-source-watch = ["nara/asset-watch"]

[dependencies]
nara_asset = { path = "../../../../crates/nara_asset" }
nara_core = { path = "../../../../crates/nara_core" }
nara_image = { path = "../../../../crates/nara_image" }
nara_material = { path = "../../../../crates/nara_material", features = ["material"] }
nara_sprite = { path = "../../../../crates/nara_sprite" }
nara_tilemap = { path = "../../../../crates/nara_tilemap" }

[dev-dependencies]
nara = { path = "../../../..", default-features = false, features = ["tooling", "project-workflow", "presentation-2d"] }

[[test]]
name = "source_watching"
required-features = ["native-source-watch"]
