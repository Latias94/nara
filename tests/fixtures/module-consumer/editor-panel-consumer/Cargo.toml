[package]
name = "nara-editor-panel-module-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
snap-child-experiment = []

[[bin]]
name = "snap_local_position_child"
path = "tests/support/snap_child_main.rs"
required-features = ["snap-child-experiment"]
test = false
bench = false

[dependencies]
dear-imgui-rs = "=0.21.0"
nara = { path = "../../../..", default-features = false, features = ["tooling"] }
nara_asset = { path = "../../../../crates/nara_asset", default-features = false, features = ["serde"] }
nara-asset-domain-consumer = { path = "../asset-domain-consumer" }
nara-editor = { path = "../../../../editor" }
nara_tooling = { path = "../../../../crates/nara_tooling" }
serde_json = "1"
