[package]
name = "nara-scene-module-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = ["fs-consumer", "project-workflow-consumer", "material-consumer", "editor-panel-consumer", "asset-domain-consumer"]
default-members = [".", "fs-consumer", "project-workflow-consumer", "material-consumer", "editor-panel-consumer", "asset-domain-consumer"]

[dependencies]
nara_reflect = { path = "../../../crates/nara_reflect" }
nara_scene = { path = "../../../crates/nara_scene", default-features = false, features = ["serde"] }

[dev-dependencies]
bevy_ecs = "0.20"
nara_app = { path = "../../../crates/nara_app" }
nara_asset = { path = "../../../crates/nara_asset", default-features = false, features = ["serde"] }
nara_ecs = { path = "../../../crates/nara_ecs" }
nara_engine = { package = "nara", path = "../../..", default-features = false, features = ["tooling", "project-workflow", "presentation-2d"] }
nara_core = { path = "../../../crates/nara_core" }
nara_fs = { path = "../../../crates/nara_fs" }
nara_hierarchy = { path = "../../../crates/nara_hierarchy" }
nara_image = { path = "../../../crates/nara_image", features = ["render-prepare", "serde"] }
nara_material = { path = "../../../crates/nara_material" }
nara_render = { path = "../../../crates/nara_render" }
nara_tasks = { path = "../../../crates/nara_tasks" }
nara_tilemap = { path = "../../../crates/nara_tilemap", features = ["serde"] }
nara_transform = { path = "../../../crates/nara_transform" }
nara_identity = { path = "../../../crates/nara_identity", features = ["serde"] }
nara_tooling = { path = "../../../crates/nara_tooling" }
nara_ui_kernel = { path = "../../../crates/nara_ui_kernel" }
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"
uuid = "1.23.4"
