[package]
name = "nara-asset-domain-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
nara_asset = { path = "../../../../crates/nara_asset", default-features = false, features = ["serde"] }
nara_core = { path = "../../../../crates/nara_core", features = ["serde"] }
nara_diagnostic = { path = "../../../../crates/nara_diagnostic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nara = { path = "../../../..", default-features = false, features = ["project-workflow"] }
