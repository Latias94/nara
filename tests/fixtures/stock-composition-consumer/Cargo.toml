[package]
name = "nara-stock-composition-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = ["effects/blur", "effects/grade"]

[features]
native-editor = ["dep:nara-editor"]

[[example]]
name = "editor_scene"
required-features = ["native-editor"]

[dependencies]
nara = { path = "../../..", default-features = false, features = ["project-workflow", "tooling", "presentation-2d", "presentation-ui", "desktop-winit", "render-wgpu"] }
nara_render_wgpu = { path = "../../../crates/nara_render_wgpu", default-features = false, features = ["stock-sprite", "stock-ui"] }
nara-stock-blur-effect = { path = "effects/blur" }
nara-stock-grade-effect = { path = "effects/grade" }
nara-editor = { path = "../../../editor", optional = true }
half = "2.7.1"
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }

[dev-dependencies]
nara_text = { path = "../../../crates/nara_text", default-features = false }
nara_ui_kernel = { path = "../../../crates/nara_ui_kernel", default-features = false }
nara_ui_render = { path = "../../../crates/nara_ui_render", default-features = false }
tempfile = "3"
serde_json = "1"

[patch.crates-io]
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
